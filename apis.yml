name: Crowdery
description: 'Crowdery was a consumer retail and e-commerce startup backed by a16z,
  listed on the a16z investment list. Its product inverted the traditional retail sales
  model: shoppers voted on product designs from a curated set, Crowdery assembled a
  personalized marketplace from each shopper''s top picks, and the highest-voted products
  were opened for pre-order at a discount. For brands it offered consumer feedback
  loops, pre-production demographic analytics, and pre-orders intended to de-risk
  manufacturing runs. The company never shipped a public API or developer program.
  As of July 2026 Crowdery appears defunct: the apex domain crowdery.com serves a
  Doteasy hosting placeholder page, www.crowdery.com still delegates to a decommissioned
  Heroku prelaunch application that returns 404, and no developer portal, documentation,
  GitHub organization, or API surface could be found. This profile is retained as a
  historical a16z portfolio record with no API surface to enrich.'
